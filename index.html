<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const StatCard = ({ title, value, icon, borderColor, textColor }) => {
      return (
        <div className={`bg-white p-4 rounded-xl shadow-sm border-l-4 ${borderColor} flex justify-between items-center my-3`}>
          <div>
            <p className="text-xs font-bold text-gray-500 uppercase tracking-wider">{title}</p>
            <h3 className={`text-xl font-extrabold mt-1 ${textColor || 'text-gray-800'}`}>{value}</h3>
          </div>
          {icon && <div className="text-2xl">{icon}</div>}
        </div>
      );
    };

    function App() {
      return (
        <div className="min-h-screen p-4 max-w-md mx-auto">
          {/* Header */}
          <div className="bg-white p-4 rounded-xl shadow-sm mb-4">
            <h2 className="font-bold text-gray-800 text-lg">Executive Analytics Dashboard</h2>
            <p className="text-xs text-gray-400 mt-1">Real-time System Overview</p>
          </div>

          {/* Cards */}
          <StatCard 
            title="TODAY'S SALES" 
            value="Rs. 0.00" 
            borderColor="border-emerald-500" 
            textColor="text-emerald-600" 
            icon="💵"
          />
          <StatCard 
            title="TODAY'S PROFIT" 
            value="Rs. 0.00" 
            borderColor="border-emerald-500" 
            textColor="text-emerald-600" 
            icon="📈"
          />
          <StatCard 
            title="MONTHLY SALES" 
            value="Rs. 60,140.00" 
            borderColor="border-blue-500" 
            textColor="text-blue-600" 
            icon="🛍️"
          />
          <StatCard 
            title="PENDING REPAIRS" 
            value="0 Jobs" 
            borderColor="border-amber-500" 
            textColor="text-amber-600" 
            icon="🔧"
          />

          {/* Grid */}
          <div className="grid grid-cols-2 gap-3 mt-4">
            <div className="bg-white p-4 rounded-xl shadow-sm text-center">
              <p className="text-xs font-bold text-gray-500 uppercase">TOTAL PRODUCTS</p>
              <h4 className="text-lg font-bold text-gray-800 mt-1">2</h4>
            </div>
            <div className="bg-white p-4 rounded-xl shadow-sm text-center">
              <p className="text-xs font-bold text-gray-500 uppercase">TOTAL MOBILES</p>
              <h4 className="text-lg font-bold text-gray-800 mt-1">2</h4>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
